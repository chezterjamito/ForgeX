<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <title>ForgeX - Login</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>

<body>
  <nav>
    <div class="logo">FORGEX</div>
    <div><a href="index.html">Home</a></div>
  </nav>

  <div class="container" style="min-height: 80vh; display: flex; align-items: center; justify-content: center;">
    <div class="card" style="max-width: 400px; width: 100%;">
      <h2>Log in</h2>
      <form id="loginForm">
        <input type="email" id="email" placeholder="Email" required>
        <input type="password" id="password" placeholder="Password" required>
        <button type="submit" class="btn">Login</button>
        <h5>Dont have Account?<a href="register.html"> Create Account </a></h5>
        <p id="message"></p>
      </form>
    </div>
  </div>
  </div>

  <script src="js/api.js"></script>
  <script>
    document.getElementById("loginForm").addEventListener("submit", async (e) => {
      e.preventDefault();
      const msg = document.getElementById("message");
      msg.textContent = "";

      const email = document.getElementById("email").value.trim();
      const password = document.getElementById("password").value;

      try {
        const res = await apiFetch("/auth/login.php", "POST", { email, password });
        localStorage.setItem("forgex_logged_in", "1");
        localStorage.setItem("forgex_username", res.username);
        localStorage.setItem("forgex_is_admin", res.is_admin ? "1" : "0");

        // Check whether this user already has a power assigned
        try {
          await apiFetch("/powers/get_my_power.php");
          window.location.href = "dashboard.html";
        } catch (e2) {
          // No power yet -> send to the discovery quiz
          window.location.href = "quiz.html";
        }
      } catch (err) {
        msg.textContent = err.message;
        msg.className = "error";
      }
    });
  </script>
</body>

</html>
