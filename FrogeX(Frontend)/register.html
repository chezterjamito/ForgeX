<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <title>ForgeX - Register</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>

<body>
  <nav>
    <div class="logo">FORGEX</div>
    <div><a href="index.html">Home</a></div>
  </nav>

  <div class="container"
    style="min-height: calc(100vh - 120px); display: flex; align-items: center; justify-content: center;">
    <div class="card" style="max-width:400px;margin:0 auto;">
      <h2>Create your account</h2>
      <form id="registerForm">
        <input type="text" id="username" placeholder="Username" required>
        <input type="email" id="email" placeholder="Email" required>
        <input type="password" id="password" placeholder="Password" required>
        <input type="password" id="confirmPassword" placeholder="Confirm password" required>
        <button type="submit" class="btn">Register</button>
        <h5>Already have Account?<a href="login.html"> Login </a></h5>
        <p id="message"></p>
      </form>
    </div>
  </div>

  <script src="js/api.js"></script>
  <script>
    document.getElementById("registerForm").addEventListener("submit", async (e) => {
      e.preventDefault();
      const msg = document.getElementById("message");
      msg.textContent = "";

      const username = document.getElementById("username").value.trim();
      const email = document.getElementById("email").value.trim();
      const password = document.getElementById("password").value;
      const confirmPassword = document.getElementById("confirmPassword").value;

      if (password !== confirmPassword) {
        msg.textContent = "Passwords do not match.";
        msg.className = "error";
        return;
      }

      try {
        await apiFetch("/auth/register.php", "POST", { username, email, password });
        msg.textContent = "Account created! Redirecting to login...";
        msg.className = "success";
        setTimeout(() => window.location.href = "login.html", 1200);
      } catch (err) {
        msg.textContent = err.message;
        msg.className = "error";
      }
    });
  </script>
</body>

</html>
